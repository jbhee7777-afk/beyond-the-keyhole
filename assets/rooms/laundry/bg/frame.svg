<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs>
<filter id="art" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="1780" result="w"/>
<feDisplacementMap in="SourceGraphic" in2="w" scale="1" xChannelSelector="R" yChannelSelector="G" result="d"/>
<feTurbulence type="fractalNoise" baseFrequency="0.007" numOctaves="3" seed="1787" result="t"/>
<feColorMatrix in="t" type="matrix" values="0.3 0 0 0 0.85  0.3 0 0 0 0.85  0.3 0 0 0 0.85  0 0 0 0 1" result="tw"/>
<feBlend in="d" in2="tw" mode="multiply" result="m"/>
<feComposite in="m" in2="d" operator="in"/>
</filter>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="6" stroke="#33261c" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-48)"><line x1="0" y1="0" x2="0" y2="5" stroke="#33261c" stroke-width="1"/></pattern>
<pattern id="hatchw" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><line x1="0" y1="0" x2="0" y2="7" stroke="#fff8e0" stroke-width="1.3"/></pattern>
</defs><g filter="url(#art)"><g filter="url(#blur)"><ellipse cx="-40" cy="900" rx="260" ry="120" fill="#ffffff" opacity="0.85"/><ellipse cx="200" cy="930" rx="220" ry="80" fill="#ffffff" opacity="0.85"/><ellipse cx="1640" cy="900" rx="260" ry="120" fill="#ffffff" opacity="0.85"/><ellipse cx="1400" cy="940" rx="220" ry="80" fill="#ffffff" opacity="0.85"/><ellipse cx="-60" cy="40" rx="200" ry="110" fill="#ffffff" opacity="0.85"/><ellipse cx="1660" cy="30" rx="200" ry="110" fill="#ffffff" opacity="0.85"/><ellipse cx="-40" cy="460" rx="90" ry="200" fill="#ffffff" opacity="0.85"/><ellipse cx="1650" cy="480" rx="80" ry="180" fill="#ffffff" opacity="0.85"/></g></g></svg>